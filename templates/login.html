{% extends "base.html" %}

{% block title %}Login | OTT Explorer{% endblock %}

{% block content %}
<div class="profile-section">
    <div style="width:100%; max-width:420px;">
        <h1 class="profile-title" style="margin-bottom:8px;">🎬 OTT Explorer</h1>
        <p style="color:var(--text-muted); text-align:center; margin-bottom:32px; font-size:15px;">Sign in to your account</p>

        {% if error %}
        <div style="background:rgba(229,9,20,0.15); border:1px solid var(--primary); border-radius:var(--radius-sm); padding:10px 16px; margin-bottom:20px; font-size:13px; color:#ff6b6b;">
            ⚠ {{ error }}
        </div>
        {% endif %}

        <div class="glass-panel" style="padding:32px;">
            <form method="POST" action="{{ url_for('main.login') }}">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="form-input" placeholder="Enter your username" required autocomplete="username">
                </div>
                <div class="form-group" style="margin-top:16px;">
                    <label>Password</label>
                    <input type="password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="landing-btn" style="width:100%; margin-top:28px; padding:14px; font-size:15px; justify-content:center; border-radius:var(--radius-sm);">
                    Sign In ➔
                </button>
            </form>
        </div>

        <p style="text-align:center; margin-top:20px; color:var(--text-muted); font-size:14px;">
            New here? <a href="{{ url_for('main.register') }}" style="color:var(--primary); font-weight:600; text-decoration:none;">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
